[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderlens-subnet"
version = "0.2.0"
description = "Live TED notice-version comparison and Bittensor testnet subnet prototype"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
authors = [{name = "TenderLens contributors"}]
dependencies = [
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
testnet = ["bittensor==11.3.0"]

[project.scripts]
tenderlens-web = "tenderlens.web:main"
tenderlens-miner = "tenderlens.miner_server:main"
tenderlens-validator = "tenderlens.validator:main"

[tool.setuptools]
packages = ["tenderlens"]
